name: testes

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  motor:
    name: Testes do motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rodar os testes do núcleo
        run: node --test test/*.test.js
